
<!DOCTYPE html>
<html lang="ha">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DORA FILM PRO</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101018;color:white;font-family:Arial,sans-serif}
header{background:#d71920;padding:22px;text-align:center}
header h1{margin:0;font-size:30px}
header p{margin:7px 0 0}
main{max-width:850px;margin:auto;padding:16px}
.panel{background:#20202c;padding:16px;border-radius:12px;margin:16px 0}
input,select,button{width:100%;padding:13px;margin:7px 0;border:0;border-radius:7px;font-size:16px}
button{background:#e31b23;color:white;font-weight:bold;cursor:pointer}
button:disabled{opacity:.5}
h2{color:#ff454b}
.film{background:#20202c;padding:12px;border-radius:10px;margin:14px 0}
iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:8px}
.film h3{margin:10px 0}
small{color:#ccc}
#message{color:#ffcf60}
</style>
</head>
<body>

<header>
<h1>🎬 DORA FILM</h1>
<p>Hausa • English • French</p>
</header>

<main>
<div class="panel">
<h2>➕ Ƙara Sabon Fim</h2>
<input id="filmTitle" placeholder="Sunan fim">
<select id="filmLanguage">
<option value="Hausa">Hausa</option>
<option value="English">English</option>
<option value="French">French</option>
</select>
<input id="filmURL" placeholder="Liƙa YouTube link">
<button id="addButton" onclick="addFilm()">ADD FILM</button>
<p id="message"></p>
</div>

<h2>🍿 Fina-finanmu</h2>
<div id="films">Ana ɗauko fina-finai...</div>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
// MAYE GURBIN WANNAN DA AINIHI FIREBASE CONFIG DINKA
const firebaseConfig = {
  apiKey: "SAKA_API_KEY_DINKA",
  authDomain: "SAKA_AUTH_DOMAIN_DINKA",
  projectId: "SAKA_PROJECT_ID_DINKA",
  storageBucket: "SAKA_STORAGE_BUCKET_DINKA",
  messagingSenderId: "SAKA_MESSAGING_SENDER_ID_DINKA",
  appId: "SAKA_APP_ID_DINKA"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

function getVideoId(url) {
  try {
    const u = new URL(url);
    if (u.hostname.includes("youtu.be"))
      return u.pathname.slice(1).split("/")[0];
    if (u.searchParams.get("v"))
      return u.searchParams.get("v");
    const parts = u.pathname.split("/");
    if (["embed","shorts"].includes(parts[1]))
      return parts[2];
  } catch(e) {}
  return null;
}

async function addFilm() {
  const title = document.getElementById("filmTitle").value.trim();
  const language = document.getElementById("filmLanguage").value;
  const url = document.getElementById("filmURL").value.trim();
  const videoId = getVideoId(url);
  const message = document.getElementById("message");
  const button = document.getElementById("addButton");

  if (!title || !videoId) {
    message.textContent = "Saka sunan fim da ingantaccen YouTube link.";
    return;
  }

  button.disabled = true;
  message.textContent = "Ana adana fim...";

  try {
    await db.collection("films").add({
      title,
      language,
      videoId,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });

    document.getElementById("filmTitle").value = "";
    document.getElementById("filmURL").value = "";
    message.textContent = "An adana fim cikin nasara!";
  } catch(error) {
    message.textContent = "An samu matsala: " + error.message;
  }

  button.disabled = false;
}

db.collection("films").orderBy("createdAt", "desc")
.onSnapshot(snapshot => {
  const container = document.getElementById("films");
  container.innerHTML = "";

  if (snapshot.empty) {
    container.textContent = "Babu fim tukuna.";
    return;
  }

  snapshot.forEach(doc => {
    const film = doc.data();
    const card = document.createElement("div");
    card.className = "film";

    const heading = document.createElement("h3");
    heading.textContent = film.title;

    const language = document.createElement("small");
    language.textContent = "Harshe: " + film.language;

    const player = document.createElement("iframe");
    player.src = "https://www.youtube.com/embed/" +
      encodeURIComponent(film.videoId);
    player.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";
    player.allowFullscreen = true;
    player.title = film.title;

    card.append(heading, language, player);
    container.appendChild(card);
  });
}, error => {
  document.getElementById("films").textContent =
    "Ba a iya ɗauko fina-finai ba: " + error.message;
});
</script>
</body>
</html>
