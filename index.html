
<!DOCTYPE html>
<html lang="ha">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DORA FILM</title>
<style>
body{margin:0;background:#101010;color:white;font-family:Arial}
header{background:#d60000;text-align:center;padding:20px}
h1{margin:0;font-size:32px}
main{padding:15px;max-width:850px;margin:auto}
input,select,button{box-sizing:border-box;width:100%;padding:13px;margin:7px 0;border:0;border-radius:6px;font-size:16px}
button{background:#e00000;color:white;font-weight:bold}
.film{background:#252525;padding:12px;margin:15px 0;border-radius:10px}
iframe{width:100%;aspect-ratio:16/9;border:0}
small{color:#ccc}
#message{color:#00e676}
</style>
</head>
<body>
<header><h1>DORA FILM</h1>
<p>Hausa • English • French</p></header>
<main>
<h2>Ƙara Sabon Fim</h2>
<input id="filmTitle" placeholder="Sunan fim">
<select id="filmLanguage">
<option value="Hausa">Hausa</option>
<option value="English">English</option>
<option value="French">French</option>
</select>
<input id="filmURL" placeholder="Saka YouTube link">
<button onclick="addFilm()">ADD FILM</button>
<p id="message"></p>
<hr>
<h2>Fina-finai</h2>
<div id="films">Ana ɗauko fina-finai...</div>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
apiKey: "AIzaSyCzh8VXNw5t-h_lpUPhFOkeNueGr17MFn4",
authDomain: "dora-film.firebaseapp.com",
projectId: "dora-film",
storageBucket: "dora-film.firebasestorage.app",
messagingSenderId: "626028311638",
appId: "1:626028311638:web:61d177e15648d0983437f7"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

function getVideoId(url){
try{
const u = new URL(url);
if(u.hostname.includes("youtu.be")) return u.pathname.slice(1);
if(u.hostname.includes("youtube.com")){
if(u.pathname==="/watch") return u.searchParams.get("v");
if(u.pathname.startsWith("/embed/")) return u.pathname.split("/")[2];
if(u.pathname.startsWith("/shorts/")) return u.pathname.split("/")[2];
}
}catch(e){}
return null;
}

async function addFilm(){
const title=document.getElementById("filmTitle").value.trim();
const language=document.getElementById("filmLanguage").value;
const url=document.getElementById("filmURL").value.trim();
const videoId=getVideoId(url);
const message=document.getElementById("message");
if(!title||!videoId){
message.textContent="Saka sunan fim da ingantaccen YouTube link.";
return;
}
try{
await db.collection("films").add({
title,language,videoId,createdAt:firebase.firestore.FieldValue.serverTimestamp()
});
message.textContent="An ƙara fim cikin nasara!";
document.getElementById("filmTitle").value="";
document.getElementById("filmURL").value="";
}catch(e){
message.textContent="An samu matsala: "+e.message;
}
}

db.collection("films").orderBy("createdAt","desc").onSnapshot(snapshot=>{
const container=document.getElementById("films");
container.innerHTML="";
snapshot.forEach(doc=>{
const film=doc.data();
const card=document.createElement("div");
card.className="film";
const heading=document.createElement("h3");
heading.textContent=film.title;
const language=document.createElement("small");
language.textContent="Harshe: "+film.language;
const player=document.createElement("iframe");
player.src="https://www.youtube.com/embed/"+encodeURIComponent(film.videoId);
player.title=film.title;
player.allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture";
player.allowFullscreen=true;
card.append(heading,language,player);
container.appendChild(card);
});
if(snapshot.empty) container.textContent="Babu fim tukuna.";
},error=>{
document.getElementById("films").textContent="An samu matsala wajen ɗauko fina-finai.";
});
</script>
</body>
</html>
