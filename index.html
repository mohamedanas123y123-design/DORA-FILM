
<!DOCTYPE html>
<html lang="ha">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DORA FILM</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090910;color:white;font-family:Arial,sans-serif}
header{background:#e50914;text-align:center;padding:25px}
header h1{font-size:34px;margin:0}
header p{margin:8px 0 0}
nav{text-align:center;padding:18px}
select,input{padding:13px;border-radius:8px;border:none;margin:6px}
input{width:90%;max-width:450px}
h2{color:#ff3030;padding:12px}
.movies{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:12px}
.movie{background:#20202b;border-radius:12px;overflow:hidden;text-align:center;padding-bottom:15px}
.poster{height:135px;background:linear-gradient(140deg,#e50914,#32104c);display:flex;align-items:center;justify-content:center;font-size:55px}
button{background:#e50914;color:white;padding:11px 20px;border:0;border-radius:7px}
footer{text-align:center;padding:25px;color:#aaa}
</style>
</head>
<body>

<header>
<h1>🎬 DORA FILM</h1>
<p id="welcome">Barka da zuwa DORA FILM</p>
</header>

<nav>
<select id="language" onchange="changeLanguage()">
<option value="ha">Hausa</option>
<option value="en">English</option>
<option value="fr">Français</option>
</select>
<br>
<input id="search" placeholder="Nemi fim..." oninput="searchMovies()">
</nav>

<h2 id="heading">Fina-finanmu</h2>

<div class="movies">

<div class="movie">
<div class="poster">🎥</div>
<h3>Fina-finan Hausa</h3>
<p>Hausa Movies</p>
<button onclick="alert('Za a saka fina-finan Hausa nan ba da jimawa ba')">Kalli fim</button>
</div>

<div class="movie">
<div class="poster">🎞️</div>
<h3>English Movies</h3>
<p>English Films</p>
<button onclick="alert('English movies coming soon')">Watch</button>
</div>

<div class="movie">
<div class="poster">🍿</div>
<h3>Films Français</h3>
<p>French Movies</p>
<button onclick="alert('Films français bientôt disponibles')">Regarder</button>
</div>

<div class="movie">
<div class="poster">⭐</div>
<h3>DORA FILM</h3>
<p>Entertainment</p>
<button onclick="alert('Welcome to DORA FILM')">Open</button>
</div>

</div>

<footer>
<p>© 2026 DORA FILM</p>
<p>Hausa | English | Français</p>
</footer>

<script>
const words={
ha:{
welcome:"Barka da zuwa DORA FILM",
heading:"Fina-finanmu",
search:"Nemi fim..."
},
en:{
welcome:"Welcome to DORA FILM",
heading:"Our Movies",
search:"Search movies..."
},
fr:{
welcome:"Bienvenue sur DORA FILM",
heading:"Nos Films",
search:"Rechercher un film..."
}
};

function changeLanguage(){
let lang=document.getElementById("language").value;
document.getElementById("welcome").textContent=words[lang].welcome;
document.getElementById("heading").textContent=words[lang].heading;
document.getElementById("search").placeholder=words[lang].search;
}

function searchMovies(){
let value=document.getElementById("search").value.toLowerCase();
document.querySelectorAll(".movie").forEach(movie=>{
movie.style.display=movie.textContent.toLowerCase().includes(value)?"block":"none";
});
}
</script>

</body>
</html>
